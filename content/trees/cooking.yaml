schemaVersion: 1
contentVersion: 1
id: cooking
title: Cooking
summary: >-
  Feeding yourself and other people well, from a first fried egg to a menu you
  designed, costed, tested, and can teach to someone else. Ten levels of
  everyday kitchen competence — knife work, heat control, baking, preservation,
  butchery, and the planning that turns separate dishes into a meal that lands
  on the table at the same time.
domain: home
facets:
  - practical
  - kitchen
provenance:
  authors:
    - name: Ethan Morchy
  copyleftDerived: false
lineage: []

levels:
  - level: 1
    milestones:
      - id: knife-grip
        title: Dice an onion evenly with a pinch grip
        label: Even onion dice, pinch grip
        detail: >-
          Hold the chef's knife by pinching the blade, not the handle, and
          produce a dice from one onion in which the pieces are visibly the same
          size.
        uid: E5CJB3R1
      - id: boil-pasta
        title: Cook dried pasta to al dente and drain it
        label: Pasta to al dente
        detail: >-
          Salt the water, taste a strand before the package time is up, and stop
          the cooking at bite rather than at the timer.
        uid: Z77TSTX6
      - id: fried-egg
        title: Fry an egg with an unbroken yolk and no browned white
        label: Fried egg, unbroken yolk
        uid: HTAXVQFS
      - id: season-to-taste
        title: Salt a pot of soup in stages until you can say it is seasoned
        label: Season a soup in stages
        detail: >-
          Add salt in at least three increments, tasting between each, and state
          when it is correct rather than emptying a measured spoon.
        uid: ZRT4QN66
      - id: clean-as-you-go
        title: Finish a meal with an empty sink and a wiped board
        label: Clean as you go
        uid: B800KG9K

  - level: 2
    milestones:
      - id: rice-absorption
        title: Cook rice by absorption with separate, unburnt grains
        label: Rice by absorption
        requires: [ boil-pasta ]
        uid: ETSMSR9C
      - id: sear-chicken-thigh
        title: Sear a chicken thigh skin-side down to a crisp skin, cooked through
        label: Crisp-skinned chicken thigh
        requires: [ knife-grip ]
        uid: PDGE2TQW
      - id: roast-vegetables
        title: Roast a sheet pan of vegetables browned at the edges, not steamed
        label: Roast vegetables, browned
        requires: [ season-to-taste ]
        uid: K6HNY0G7
      - id: simple-vinaigrette
        title: Mix a vinaigrette that tastes balanced rather than sharp
        label: Balanced vinaigrette
        uid: N2QQ055G
      - id: soft-scramble
        title: Scramble eggs to a soft curd over low heat
        label: Soft-scrambled eggs
        requires: [ fried-egg ]
        uid: 5G9FNB7S
      - id: stock-from-scraps
        title: Simmer a stock from bones or vegetable trimmings and strain it clear
        label: Clear stock from scraps
        uid: JCAHD49Y

  - level: 3
    milestones:
      - id: sear-steak-temp
        title: Sear a steak to a target internal temperature and rest it
        label: Steak to temperature, rested
        detail: >-
          Name the target before cooking, verify it with a probe rather than by
          touch, and rest the meat before slicing.
        requires: [ sear-chicken-thigh ]
        uid: GHC7G9SN
      - id: pan-sauce
        title: Build a pan sauce from the fond left by a sear
        label: Pan sauce from the fond
        requires: [ sear-chicken-thigh, stock-from-scraps ]
        uid: 5XQQGFQX
      - id: braise-tough-cut
        title: Braise a tough cut until it yields to a fork
        label: Braise a tough cut
        requires: [ stock-from-scraps ]
        uid: ZAGZM4HJ
      - id: knife-julienne
        title: Cut a vegetable into even julienne without a mandoline
        label: Even julienne by knife
        requires: [ knife-grip ]
        uid: XSTM4Y4B
      - id: emulsified-dressing
        title: Emulsify a dressing that does not separate within an hour
        label: Dressing that holds
        requires: [ simple-vinaigrette ]
        uid: 1TE21BZJ
      - id: blanch-and-shock
        title: Blanch a green vegetable and shock it so it stays green
        label: Blanch and shock greens
        requires: [ boil-pasta ]
        uid: MCZAWWRF

  - level: 4
    milestones:
      - id: oven-calibration
        title: Measure your oven's real temperature and correct for the error
        label: Calibrate your oven
        uid: 90FTYKZ3
      - id: yeast-bread
        title: Bake a yeasted loaf with an open crumb and a set crust
        label: Yeasted loaf, open crumb
        requires: [ oven-calibration ]
        uid: A574KXJ0
      - id: shortcrust-pastry
        title: Make a shortcrust that stays tender and does not shrink in the tin
        label: Shortcrust that stays tender
        requires: [ oven-calibration ]
        uid: 52H06Q59
      - id: pancake-batter
        title: Mix a batter by weight and cook pancakes of consistent thickness
        label: Batter by weight
        uid: RMGNADFG
      - id: cookie-creaming
        title: Cream butter and sugar to the stage a recipe calls for and name it
        label: Cream butter and sugar
        requires: [ oven-calibration ]
        uid: 3WRDR437

  - level: 5
    milestones:
      - id: mise-en-place
        title: Set out every prepped component before the first pan gets hot
        label: Full mise en place
        requires: [ knife-julienne ]
        uid: A65RBKB4
      - id: three-dish-timing
        title: Serve three dishes hot at the same moment
        label: Three dishes, one moment
        requires: [ sear-steak-temp, roast-vegetables, mise-en-place ]
        uid: 6RRG2GTS
      - id: taste-adjust-acid
        title: Fix a flat dish with acid, salt, or fat and say which one you used
        label: Fix a flat dish
        requires: [ season-to-taste ]
        uid: 6ENP3VAF
      - id: menu-for-six
        title: Plan and shop a three-course menu for six from one written list
        label: Three courses for six
        uid: RCH5ZWEK
      - id: plate-hot-food
        title: Plate a course on warmed plates without it going cold or smeared
        label: Plate hot, plate clean
        uid: C5W3656V

  - level: 6
    milestones:
      - id: pickle-quick
        title: Make a quick pickle that is crisp and correctly sour after a day
        label: Quick pickle
        uid: R12KY0BG
      - id: ferment-sauerkraut
        title: Ferment cabbage to a safe, sour kraut without mould
        label: Ferment sauerkraut
        requires: [ pickle-quick ]
        uid: Z46WXJ48
      - id: freeze-portion
        title: Portion, label, and freeze cooked food that reheats without damage
        label: Portion, label, freeze
        uid: BW7CGF51
      - id: stock-clarify
        title: Reduce and clarify a stock to a clean-tasting glace
        label: Clarify a stock to glace
        requires: [ stock-from-scraps ]
        uid: 1KFSCV7H
      - id: preserve-in-fat
        title: Confit a cut in fat and store it under a sealed layer
        label: Confit and store in fat
        requires: [ braise-tough-cut ]
        uid: GZQMZ7H2

  - level: 7
    milestones:
      - id: wok-stir-fry
        title: Stir-fry over high heat without crowding or steaming the pan
        label: Stir-fry over high heat
        requires: [ sear-chicken-thigh ]
        uid: Y0V8DZCP
      - id: whole-spice-curry
        title: Build a curry from whole spices you toasted and ground yourself
        label: Curry from whole spices
        requires: [ taste-adjust-acid ]
        uid: 7VE7DQ4G
      - id: fresh-pasta-dough
        title: Roll and cut fresh pasta that holds its shape when boiled
        label: Fresh pasta, rolled and cut
        requires: [ shortcrust-pastry ]
        uid: H25J1J64
      - id: sushi-rice
        title: Season sushi rice to the right gloss, temperature, and stickiness
        label: Season sushi rice
        requires: [ rice-absorption ]
        uid: QZEFE2QX
      - id: corn-tortillas
        title: Press and griddle corn tortillas that puff and stay pliable
        label: Corn tortillas that puff
        requires: [ pancake-batter ]
        uid: V16R1X38

  - level: 8
    milestones:
      - id: break-down-chicken
        title: Break down a whole chicken into eight pieces plus a carcass
        label: Break down a whole chicken
        requires: [ knife-julienne ]
        uid: EMSAV0B8
      - id: fillet-round-fish
        title: Fillet a round fish leaving no flesh on the bone
        label: Fillet a round fish
        requires: [ break-down-chicken ]
        uid: VM1QVYCS
      - id: live-fire-cooking
        title: Cook a full meal over live fire with heat zones you built
        label: A meal over live fire
        requires: [ sear-steak-temp ]
        uid: KFG53621
      - id: charcuterie-cure
        title: Cure and dry a piece of meat safely to a measured weight loss
        label: Cure and dry a whole cut
        requires: [ ferment-sauerkraut, preserve-in-fat ]
        uid: KP78K85J
      - id: bone-and-roll-joint
        title: Bone, roll, and tie a joint that cooks evenly
        label: Bone, roll, and tie a joint
        requires: [ break-down-chicken ]
        uid: GP1GQ74P

  - level: 9
    milestones:
      - id: recipe-development
        title: Develop a dish over repeated tests until the result is repeatable
        label: Develop a repeatable dish
        detail: >-
          Change one variable per test, write down what changed, and stop when
          two consecutive cooks give the same result.
        requires: [ taste-adjust-acid, three-dish-timing ]
        uid: 1QGQ67D5
      - id: scale-recipe-by-weight
        title: Rewrite a recipe in weights and bakers' percentages and scale it
        label: Rewrite and scale by weight
        requires: [ menu-for-six, yeast-bread ]
        uid: 8W8K3REG
      - id: substitute-under-constraint
        title: Cook a planned dish with a missing key ingredient and no shopping trip
        label: Cook around a missing key
        requires: [ taste-adjust-acid ]
        uid: YEB0VDEP
      - id: dinner-party-twelve
        title: Cook and serve a seated dinner for twelve
        label: Seated dinner for twelve
        requires: [ three-dish-timing, menu-for-six ]
        uid: AXJW3BE9
      - id: cost-a-menu
        title: Cost a menu per head against real receipts
        label: Cost a menu per head
        requires: [ menu-for-six ]
        uid: JG2JJG1A

  - level: 10
    milestones:
      - id: teach-a-beginner
        title: Teach a beginner a dish they can then cook unsupervised
        label: Teach a beginner a dish
        requires: [ recipe-development ]
        uid: XP5X65PD
      - id: market-basket-meal
        title: Cook a full meal from an unplanned market basket
        label: Meal from a market basket
        requires: [ substitute-under-constraint, wok-stir-fry ]
        uid: CGD6J4KN
      - id: publish-tested-recipes
        title: Publish recipes another cook can follow to the same result
        label: Publish tested recipes
        requires: [ recipe-development, scale-recipe-by-weight ]
        uid: DHZJCGFR
      - id: seasonal-menu-year
        title: Run a menu that changes with the seasons across a full year
        label: A menu across the seasons
        requires: [ cost-a-menu, dinner-party-twelve ]
        uid: X42VDNZG
      - id: cook-for-a-crowd
        title: Cook a single service for fifty people to time and to budget
        label: Service for fifty
        requires: [ dinner-party-twelve, live-fire-cooking, cost-a-menu ]
        uid: 0R4Q58YP
