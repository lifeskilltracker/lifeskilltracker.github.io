      (2) The `layoutTree` CALL moved from the tree route into
      `lib/actions/tree-session.svelte.ts`. T14's criterion is that TreeView is the only
      view-layer file naming `lib/layout`, and T08 had deliberately made TreeView take
      positions as a prop; `lib/actions` is the only place left that satisfies both.
      (3) `/s/[tree]` and `/s/[tree]/m/[slug]` share `routes/s/[tree]/SkillPage.svelte`
