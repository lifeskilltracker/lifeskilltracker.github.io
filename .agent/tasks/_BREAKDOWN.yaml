    note: >
      Implemented and verified complete 2026-08-13. Two decisions the document did not
      make: §11.7's recency max asserts §12.2's FULL fixed-precision form, not just the
      Z suffix (Z sorts above '.', so a second-precision stamp silently beats a later
      millisecond one — T16 should expect this throw as an import diagnostic); and a
      frozen record with zero uids is refused, since [].every() is vacuously true.
      Document written 2026-08-06 in the same split. The §11.5–§11.9 half — frozen
      satisfaction, domain score, fill, recency, breadth, self-assessment, and the
      §11.9 invariants that need a score to state (1–5, 7, and the score half of 6).
      T26/F4 confirms the recency roll-up is this task's, not the store's:
      `DomainSkillRow` carries `lastActivityAt` and `DomainScore` reports the per-domain
      maximum. T26/F18's five fill bands land here too, as a dependency-free data module
      with one resolver — `DomainScore` still carries no band field, which is what keeps
      the vocabulary tunable for T13 and T20. Phase 1, and after T10 deliberately: §11.5
      is the first point §11 writes persisted state (`SKILL.grandfathered`), which is
      exactly what the schema gate exists to break. Monotonicity (N12) is a property test
      over generated inputs, not examples.
      It MODIFIES three files T11a created — `levels.ts`, `index.ts`,
      `invariants.prop.ts` — rather than adding a parallel module.

