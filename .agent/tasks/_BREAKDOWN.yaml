# Life XP Skill Tracker — v1 task breakdown
#
# The authoritative index of the v1 work, derived from docs/ARCHITECTURE.md §16.4.
# v1 = Phase 0 (walking skeleton) + Phase 1 (the v1 gate).
#
# This file is the CROSS-SESSION STAGER. A session that picks this project up should
# read it first, find rows whose `status` is not `written`, and continue from there.
# `status` tracks whether the TASK DOCUMENT exists — not whether the work is done.
# Implementation status lives in each task doc's own Status field.
#
# Authored 2026-08-05. See .agent/tasks/_TEMPLATE.md for document shape.

meta:
  version: 1
  source: docs/ARCHITECTURE.md
  phases:
    "0": Walking skeleton — falsify the schema before content authoring starts
    "1": The v1 gate — defined by the PRD's success metrics S1–S4
  doc_status_values: [pending, written]
  clusters:
    substrate-schema: { model: opus, wave: 0, note: written directly by the orchestrator }
    judgment:         { model: opus, wave: 0, note: reasoning-limited; orchestrator only }
    cli-toolchain:    { model: sonnet, wave: 1 }
    pure-engines:     { model: opus,   wave: 1 }
    runtime-io:       { model: opus,   wave: 1 }
    views:            { model: sonnet, wave: 2 }
    content-gates:    { model: sonnet, wave: 2 }

