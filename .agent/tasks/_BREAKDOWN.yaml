  - id: T30
    title: "Map camera: two levels, label tiers, and the Survey system"
    phase: 2
    cluster: views
    blocked_by: [T27, T28]
    blocks: [T31, T33, T35]
    spec: ["UI-SPEC §5.1", "UI-SPEC §5.2", "UI-SPEC §5.6", "§10.5", "§10.7", "§13.1"]
    prd: [F21, F22, F34, N5, N11]
    status: written
    doc: T30-map-camera.md
    note: >
      IMPLEMENTED AND VERIFIED COMPLETE 2026-08-17; task-doc status remains lifecycle
      metadata. The map surface is mounted by Shell.svelte, NOT by either route: SvelteKit
      destroys one route component and creates the next, so A6's "camera state, not a page"
      is only true of a surface the router cannot reach. Neither route declares a <main>.
      ONE REAL DEFECT WAS FOUND AND FIXED HERE: the shell's ResizeObserver guard read
      `=== undefined`, but a bind:this clears to `null`, so leaving the map for /library
      called observe(null), threw, and killed the client runtime — every navigation after
      that changed the URL and rendered nothing. Only a11y:manual caught it; every unit test
      mounts the shell at one path and none leaves the map.
      KNOWN LIMIT HANDED TO T31: SKILL_LABEL_WORLD_SIZE lands at 12-13 px for `play` and
      `outdoors-nature` against §5.2's 14-18 px band. Those two fit by their long axis and
      zoom least — §5.3 names them as the pair that "set the floor" but does not notice they
      fall under its own. camera.test.ts asserts the shortfall explicitly. T31 decides
      whether to widen the band or fit level 1 to a constant box; do NOT hand-tune the
      constant until one number passes, which would destroy the LOD argument.
      Original plan note follows. Two camera levels, both prerendered routes, with /d/<domainId> a camera state over the
      same surface rather than a page. Browser Back is the breadcrumb; there is no breadcrumb
      widget. Carries A3 — the water line replacing the opacity ramp — which is the single
      most important rule in UI-SPEC and was wrong in its own first draft. Label sizes are
      derived from world extent and hexSize at build time and asserted, never hand-tuned;
      that is what makes §5.1's LOD argument structural at 500 nodes. Must paint to the
      resting frame on first load, because T35's reveal layers on top of it.

