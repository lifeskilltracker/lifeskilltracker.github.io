  - id: T11b
    title: Scoring Engine — grandfathering and aggregation
    phase: 1
    cluster: pure-engines
    blocked_by: [T10]
    blocks: [T13, T14, T15, T17, T19]
    spec: ["§11.5", "§11.6", "§11.7", "§11.8", "§11.9", "§14.4"]
    prd: [F33, F34, F35, N12, D-19, D-20, D-21]
