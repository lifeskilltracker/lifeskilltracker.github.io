      §14.1 draws ACTIONS -> ROUTES, never ACTIONS -> COMP. The panel is a `$bindable`
      prop on TreeView mirrored into §13.2's `ui` store, so the URL and the open panel
      cannot disagree. (4) `SkillPageData` gained `reason: 'missing' | 'unreachable'`,
      because §16.3 has two tree-unavailable rows with different sentences and T26/F22
      requires the missing one to link to /data when a SKILL row survives.
      `store.applyMoves` is T17's and still rejects with NotImplementedHereError; cold
      start treats exactly that error as "no migrations" and reports any other failure.
      `MapRenderer` switched from `base + href` to `resolve('/d/[domain]')` now that the
      route exists — T13 left a comment asking for exactly that.

