    note: >
      Added 2026-08-05, not from §16.4. Twenty-six spec defects surfaced by writing
      task docs against the architecture — self-contradictions and undefined types that
      block implementation. F2 (grandfathering has no storage) is the expensive one:
      resolving it after T09 ships means a migration rather than a field.
      COMPLETE 2026-08-06 — all twenty-seven findings resolved and every acceptance
      criterion met. **No longer blocks any task** — remove T26 from active
      `blocked_by`/`blocks` edges; historical narrative only below.
      F15 amended all seven of its small omissions; F18 named five fill
      bands (Quiet, Emerging, Moderate, Active, Deep) as tunable data rather than a closed
      union type, unblocking T13 and T20; F27 was filed last, giving verdicts to the five
      §8 layout gaps T06 had been carrying — narrow is level 1 at the top, one synthetic
      column so columns[node.col] always resolves, tunable unit constants in §8.1,
      side-gutter geometry in §8.4, and mastery requires producing no edge.
      Group C added a manifest field (`moved`) and an export field (`contentVersionSeen`),
      so T02 and T04 both gained schema work — no new graph edges.
      Group D moved §10.3's five geometry invariants from `lst compile` to `lst validate`,
      which is the one edge change: T03 now blocks T12.
      Group I (F19, F22, F24, F25, F26 — 2026-08-06) changed no edges either, but it is
      the largest surface change since Group C. §6.2 gains rule 16 (T03) so the semantic
      rule count is 16 everywhere. §6.4 gains check 8 — trees are never removed or renamed
      (T23) — and §6.5 splits `build` into `content: compile` and `app: build`, making
      seven gating jobs (T25). §14.5 gains `reconcileAttainedLevel` (T09, called by T14)
      and `ImportReport.skillsWithNoManifestEntry` (T16). `SKILL.lastActivityAt` becomes
      total, which removes an optional from `DomainSkillRow` (T11b) and `ExportFile` (T02,
      T16). Tree `id` is documented immutable (T02, enforced by T23). New risk R-27.
      Eight further defects were folded into F22 and F24 rather than filed.
      Group G (F20, F21, F23) changed no edges. It added one method and one flag to
      §14.5 (`progressFor`, `hydrated`, both T09's), made every §14.5 writer a writer of
      §13.2's mirror (T09, T16, T17), and raised F26 — §12.3's write-back has no owner,
      which lands in T09/T14 territory and makes an existing T09 acceptance criterion
      untestable as the spec is drawn.

