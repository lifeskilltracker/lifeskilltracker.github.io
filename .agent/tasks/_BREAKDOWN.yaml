  - id: T17
    title: Lineage migration at load and orphan records
    phase: 1
    cluster: runtime-io
    blocked_by: [T09, T11b]
    blocks: []
    spec: ["§12.5", "§5.4"]
    prd: [R-03, R-16]
    status: written
    doc: T17-lineage-migration.md
    note: >
      Not named in §16.4's phase diagram but required for v1 — uids freeze at first
      merge, so user state can diverge from content from that moment on.
      T26/F13 gave it a second entry point, `applyMoves`, called by T14's cold-start
      sequence. Deliberately no hard T17 → T14 edge: T14 stubs it like the other
      same-phase components it composes, rather than lengthening the critical path.
      Implemented and verified complete 2026-08-14. The pass is split in two — `foldLineage`
      is arithmetic with no database in sight, `applyLineage` is the transaction that writes
      what it decided — because §12.5's twelve table cells, its four fold rules and F14's
      composition guarantee are all properties of the arithmetic. Two calls the document did
      not make, both resolved toward §12.5's stated reason rather than its literal wording:
      the unknown sweep also drops the uid from the frozen sets (the same permanent
      unverifiability that justifies the `retired` and `moved` deviations, reached by a third
      route); and a `merged` group whose predecessors are only partly present in a frozen set
      has those removed rather than left, since their records are consumed or orphaned
      either way. A merged successor inherits the *latest* predecessor's `at` and note —
      §12.5 fixes neither. `LineageGrammarError` closes F21 by aborting the transaction
      rather than guessing at a malformed `into`.

  - id: T18
    title: Durability, quota, and export prompting
    phase: 1
    cluster: runtime-io
    blocked_by: [T16]
    blocks: []
    spec: ["§12.7", "§17.4"]
    prd: [F39, R-18]
    status: written
    doc: T18-durability-and-quota.md
    note: >
      Not in §16.4's diagram either; §12.7 specifies it as mandatory rather than
      optional, because no browser storage mechanism is durable.
      Implemented and verified complete 2026-08-15. Five decisions the document did not
      make: §12.7's message lives in `lib/components/durability-copy.ts` rather than beside
      the triggers, because §14.1's ESLint rule refuses a component importing `lib/state`
      and the wording and the thresholds change for different reasons; the prompt's
      on-screen state is a fourth rune store rather than a `ui.notices` entry, since F15's
      dismissal is recorded against the trigger that raised it and the notice array would
      discard that reason; §16.3's quota row is a fourth prompt reason (`write-failed`) and
      deliberately not an `ExportTrigger`, with no re-arming rule and nothing persisted; the
      failed write is reported from `tree-session.apply` rather than the page, which was
      swallowing quota rejections in a bare `void` — §16.3's silent success exactly — and
      still rethrows so the write queue behaves as before; and `storageStatus()` now reads
      the estimate through `durability.pollEstimate()`, so `/data` and trigger 3 cannot
      disagree and the degrade-to-zeroes rule is written once (both Storage API fields are
      optional, and `NaN > 60` is false, so the trigger would otherwise never fire and never
      say why). `persist()` is requested from every committed user-data writer and from
      neither `hydrate` nor `recordManifest`, the latter because it runs on every cold start
      and writes no user data. The task doc's Verification block cites a
      `test:a11y` script that does not exist; T20 shipped the gate as ordinary
      `*.a11y.test.ts` Vitest files, and `routes/data/data-page.a11y.test.ts` is this task's.

  - id: T19
    title: Dismissed state end to end
    phase: 1
    cluster: views
    blocked_by: [T08, T11b]
    blocks: []
    spec: ["§11.10", "§9.3"]
    prd: [F46, D-22]
    status: written
    doc: T19-dismissed-state.md
    note: >
      Implemented and verified complete 2026-08-15. Most of the interaction already
      existed — T08 built §9.4's panel and both §11.10 warning templates, T15 added the
      un-check arithmetic, T11a/T11b established invariant 6 over a single dismissal mask.
      Two things were genuinely open. **What hiding does**: it is now a presentation-only
      suppression held by the `TreeSession` as a `SvelteSet`, writing no record and no
      `MilestoneState`, with a reveal control and an `unhide` intent so it is reversible
      from the view that performed it; §11.10 and §9.3 now say so, and §9.3 records that
      hiding is not a sixth node state. **Whether the guarantee survives the write path**:
      `routes/s/[tree]/MilestonePanel.test.ts` drives the panel against the real store over
      `fake-indexeddb` and spies on `setMilestoneState`, which is the only way to tell
      "warned first" from "wrote anyway". It sits under the route because §14.1 forbids
      `lib/components` from importing `lib/state` and ESLint enforces that on tests too.
      `scoring/dismissed.property.test.ts` states invariant 6 over dismiss/undismiss
      **sequences**, comparing after every step, and carries a vacuity guard.

