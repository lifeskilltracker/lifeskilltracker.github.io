version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: navigator-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - navigator

  grafana:
    image: grafana/grafana:latest
    container_name: navigator-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./navigator-dashboard.json:/etc/grafana/provisioning/dashboards/navigator-dashboard.json
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - navigator

volumes:
  prometheus_data:
  grafana_data:

networks:
  navigator:
    driver: bridge
